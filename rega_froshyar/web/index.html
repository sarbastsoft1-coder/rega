<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="REGA Vendor Dashboard - ئەپڵیکەیشنی فرۆشیارانی ڕێگا">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="REGA Vendor">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>REGA Vendor • فرۆشیاری ڕێگا</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0B1120;
      font-family: 'Noto Kufi Arabic', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      overflow: hidden;
    }
    #rega-splash {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 38%, rgba(234, 88, 12, 0.3) 0%, transparent 55%),
        linear-gradient(160deg, #0B1120 0%, #1C0A00 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      transition: opacity 0.4s ease-out;
      text-align: center;
      padding: 24px;
    }
    .logo-hero {
      width: min(42vw, 168px);
      height: min(42vw, 168px);
      border-radius: 36px;
      overflow: hidden;
      box-shadow: 0 18px 48px rgba(234, 88, 12, 0.38);
      animation: splash-enter 0.9s cubic-bezier(0.22, 1, 0.36, 1) both, splash-glow 1.4s ease-in-out 0.9s infinite alternate;
    }
    .logo-hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .brand {
      margin-top: 28px;
      color: #FFFFFF;
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 6px;
      animation: word-fade 0.7s ease-out 0.35s both;
    }
    .tagline {
      margin-top: 8px;
      color: #EA580C;
      font-size: 14px;
      font-weight: 700;
      animation: word-fade 0.7s ease-out 0.5s both;
    }
    @keyframes splash-enter {
      from { opacity: 0; transform: scale(0.78); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes splash-glow {
      from { box-shadow: 0 14px 36px rgba(234, 88, 12, 0.3); }
      to { box-shadow: 0 22px 56px rgba(234, 88, 12, 0.55); }
    }
    @keyframes word-fade {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }

    function removeSplash() {
      const splash = document.getElementById('rega-splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(function() {
          if (splash.parentNode) splash.parentNode.removeChild(splash);
        }, 450);
      }
    }

    const observer = new MutationObserver(function() {
      if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane') || document.querySelector('flt-scene-host')) {
        removeSplash();
        observer.disconnect();
      }
    });
    observer.observe(document.documentElement, { childList: true, subtree: true });
    setTimeout(removeSplash, 2800);
  </script>
</head>
<body>
  <div id="rega-splash">
    <div class="logo-hero">
      <img src="splash_logo.png" alt="REGA" width="168" height="168"/>
    </div>
    <div class="brand">REGA</div>
    <div class="tagline">ڕێگا فرۆشیار</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
