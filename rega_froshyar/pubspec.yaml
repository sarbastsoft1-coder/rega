name: rega_vendor
description: A new Flutter project for REGA Vendor application.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  image_picker: ^1.1.2
  flutter_image_compress: ^2.4.0
  google_fonts: ^6.2.1
  audioplayers: ^6.0.0
  http: ^1.6.0
  shared_preferences: ^2.5.6
  provider: ^6.1.2
  go_router: ^14.8.1
  url_launcher: ^6.3.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: "^0.13.1"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets1/my_icon.png"
  min_sdk_android: 21  


flutter:
  uses-material-design: true

  # Assets configuration
  assets:
    - assets/
    - assets/sounds/mixkit-happy-bells-notification-937.wav
  fonts:
    - family: NotoKufiArabic
      fonts:
        - asset: assets/fonts/NotoKufiArabic.ttf


