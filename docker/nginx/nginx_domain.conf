# ==============================================================================
# REGA Production Domain Nginx Reverse Proxy Config
# Replace yourdomain.com with your actual registered domain
# Use `certbot --nginx` to automatically enable HTTPS/SSL
# ==============================================================================

# 1. API Subdomain (api.yourdomain.com) -> Port 8001
server {
    listen 80;
    server_name api.yourdomain.com;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. Admin Subdomain (admin.yourdomain.com) -> Port 8080
server {
    listen 80;
    server_name admin.yourdomain.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# 3. Vendor Subdomain (vendor.yourdomain.com) -> Port 8081
server {
    listen 80;
    server_name vendor.yourdomain.com;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# 4. Customer Main Domain (yourdomain.com) -> Port 8082
server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# 5. Delivery Captain Subdomain (captain.yourdomain.com) -> Port 8083
server {
    listen 80;
    server_name captain.yourdomain.com delivery.yourdomain.com;

    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
