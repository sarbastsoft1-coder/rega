events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    types {
        application/wasm wasm;
        application/javascript js mjs;
        font/otf otf;
        font/ttf ttf;
        font/woff2 woff2;
    }

    sendfile        on;
    keepalive_timeout  65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm;

    # 1. Admin Web (Port 8080)
    server {
        listen 8080;
        server_name _;
        root /var/www/admin;
        index index.html;

        location / {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(wasm|js|css|png|jpg|jpeg|gif|ico|svg|woff2|otf|ttf)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
    }

    # 2. Vendor App - Froshyar (Port 8081)
    server {
        listen 8081;
        server_name _;
        root /var/www/vendor;
        index index.html;

        location / {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(wasm|js|css|png|jpg|jpeg|gif|ico|svg|woff2|otf|ttf)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
    }

    # 3. Customer App (Port 8082)
    server {
        listen 8082;
        server_name _;
        root /var/www/customer;
        index index.html;

        location / {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(wasm|js|css|png|jpg|jpeg|gif|ico|svg|woff2|otf|ttf)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
    }

    # 4. Delivery Captain App (Port 8083)
    server {
        listen 8083;
        server_name _;
        root /var/www/delivery;
        index index.html;

        location / {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(wasm|js|css|png|jpg|jpeg|gif|ico|svg|woff2|otf|ttf)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
    }

    # 5. Unified Gateway / Hub (Port 8085)
    server {
        listen 8085;
        server_name _;

        # Backend API Proxy
        location /api/ {
            proxy_pass http://backend:8001/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90;
        }

        # Storage / Media files from Backend
        location /storage/ {
            proxy_pass http://backend:8001/storage/;
            proxy_set_header Host $host;
        }

        # Default web app on port 80 -> Customer Marketplace
        location / {
            root /var/www/customer;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}

