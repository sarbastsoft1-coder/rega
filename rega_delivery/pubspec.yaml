name: delivery_app
description: "A complete modern delivery driver application in Kurdish RTL with interactive order card and OTP verification."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  geolocator: ^14.1.2
  google_fonts: ^6.2.1
  http: ^1.6.0
  latlong2: ^0.10.1
  shared_preferences: ^2.5.6
  provider: ^6.1.2
  go_router: ^14.8.1
  url_launcher: ^6.3.1
  mapbox_maps_flutter: ^3.35.2
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets1/app_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets1/logo2.png"

flutter:
  uses-material-design: true
  assets:
    - assets1/
  fonts:
    - family: NotoKufiArabic
      fonts:
        - asset: assets/fonts/NotoKufiArabic.ttf
