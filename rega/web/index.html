<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ڕێگا مارکێت - REGA Customer Marketplace">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>ڕێگا مارکێت • REGA Customer Marketplace</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0F172A;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Kufi Arabic', sans-serif;
      min-height: 100vh;
      overflow: hidden;
    }
    #rega-splash {
      position: fixed;
      inset: 0;
      background: linear-gradient(145deg, #0B1120 0%, #0F172A 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      transition: opacity 0.4s ease-out;
      text-align: center;
      padding: 24px;
    }
    .splash-card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(250, 200, 0, 0.25);
      border-radius: 28px;
      padding: 36px 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 380px;
      width: 100%;
    }
    .logo-badge {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, #FAC800 0%, #EA580C 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 900;
      color: #0F172A;
      box-shadow: 0 10px 25px rgba(250, 200, 0, 0.35);
      margin-bottom: 20px;
      animation: pulse-logo 2s infinite ease-in-out;
    }
    @keyframes pulse-logo {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); box-shadow: 0 14px 30px rgba(250, 200, 0, 0.5); }
    }
    .title {
      color: #FFFFFF;
      font-size: 21px;
      font-weight: 900;
      margin-bottom: 6px;
      letter-spacing: -0.3px;
    }
    .subtitle {
      color: #FAC800;
      font-size: 13.5px;
      font-weight: 800;
      margin-bottom: 22px;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3.5px solid rgba(250, 200, 0, 0.2);
      border-top-color: #FAC800;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
      margin-bottom: 18px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-text {
      color: #94A3B8;
      font-size: 12px;
      font-weight: 600;
    }
  </style>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        for (let r of regs) r.unregister();
      });
    }
    const observer = new MutationObserver(function() {
      if (document.querySelector('flutter-view')) {
        const splash = document.getElementById('rega-splash');
        if (splash) {
          splash.style.opacity = '0';
          setTimeout(function() {
            if (splash.parentNode) splash.parentNode.removeChild(splash);
          }, 450);
        }
        observer.disconnect();
      }
    });
    observer.observe(document.documentElement, { childList: true, subtree: true });
  </script>
</head>
<body>
  <div id="rega-splash">
    <div class="splash-card">
      <div class="logo-badge">🛍️</div>
      <div class="title">ڕێگا مارکێت</div>
      <div class="subtitle">REGA Customer Marketplace</div>
      <div class="spinner"></div>
      <div class="status-text">بارکردنی سیستەم و پەیوەندی بە سێرڤەر...</div>
    </div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
