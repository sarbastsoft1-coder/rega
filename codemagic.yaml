# REGA — iPhone IPA via Codemagic (signed .ipa only)
# Monorepo: each Flutter app lives in its own folder next to this file.
# Customer pubspec: rega/pubspec.yaml  →  APP_DIR: rega  (correct)
#
# Codemagic UI (required once before IPA succeeds):
#   Teams → Code signing identities → iOS
#   Connect Apple Developer Portal / upload cert + profile for each bundle id
#   Then run: iPhone IPA — Customer

workflows:
  ios_customer:
    name: "iPhone IPA — Customer"
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: 3.41.2
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: development
        bundle_identifier: iq.rega.customer
      vars:
        APP_DIR: rega
        REGA_API_HOST: https://api.example.com
    scripts:
      - name: Flutter pub get
        script: |
          cd $APP_DIR
          flutter pub get
          flutter precache --ios
      - name: CocoaPods install
        script: |
          cd $APP_DIR/ios
          sed -i '' "s/platform :ios,.*/platform :ios, '15.0'/" Podfile || true
          pod install --repo-update
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          set -e
          cd $APP_DIR
          flutter build ipa --release \
            --build-name=1.0.${PROJECT_BUILD_NUMBER:-1} \
            --build-number=${PROJECT_BUILD_NUMBER:-1} \
            --dart-define=REGA_API_HOST=$REGA_API_HOST \
            --export-options-plist=/Users/builder/export_options.plist
          IPA_COUNT=$(find build/ios/ipa -name '*.ipa' 2>/dev/null | wc -l | tr -d ' ')
          if [ "$IPA_COUNT" = "0" ]; then
            echo "ERROR: No .ipa produced. Configure Codemagic iOS signing for iq.rega.customer"
            exit 1
          fi
          echo "IPA ready:"
          find build/ios/ipa -name '*.ipa'
    artifacts:
      - rega/build/ios/ipa/*.ipa

