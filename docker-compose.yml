services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: rega_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-rega_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-rega_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Laravel Backend REST API Service
  backend:
    build:
      context: ./rega_backend
      dockerfile: Dockerfile
    container_name: rega_backend
    restart: unless-stopped
    environment:
      APP_NAME: "REGA Backend"
      APP_ENV: production
      APP_DEBUG: false
      APP_URL: ${APP_URL:-http://localhost:8001}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-rega_db}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-password123}
      REGA_SMS_WEBHOOK_URL: ${REGA_SMS_WEBHOOK_URL:-}
      REGA_SMS_OTP_TEMPLATE: ${REGA_SMS_OTP_TEMPLATE:-}
    volumes:
      - ./rega_backend/storage:/var/www/html/storage
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  # 3. Nginx Web Server for all 4 Flutter Web Apps & Gateway
  web:
    image: nginx:alpine
    container_name: rega_web
    restart: unless-stopped
    ports:
      - "8080:8080"   # REGA Admin Control Center
      - "8081:8081"   # REGA Froshyar (Vendor App)
      - "8082:8082"   # REGA Customer Marketplace
      - "8083:8083"   # REGA Delivery Captain
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./rega_admin/build/web:/var/www/admin:ro
      - ./rega_froshyar/build/web:/var/www/vendor:ro
      - ./rega/build/web:/var/www/customer:ro
      - ./rega_delivery/build/web:/var/www/delivery:ro
    depends_on:
      - backend

  # 4. Caddy HTTPS gateway — required for browser GPS/geolocation
  caddy:
    image: caddy:2-alpine
    container_name: rega_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - backend

volumes:
  postgres_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
